<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EcoHome Store · Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --green-dark: #1b5e20;
    --green: #2e7d32;
    --green-light: #4caf50;
    --bg: #eef5ee;
    --bubble-other: #ffffff;
    --bubble-own: #2e7d32;
    --text-dark: #1f2a1f;
    --text-muted: #6b7a6b;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    background: var(--bg);
    background-image: radial-gradient(circle at top, #dcedc8 0%, #eef5ee 55%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px;
  }

  /* ---------- Login ---------- */
  #login {
    width: 340px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(27, 94, 32, 0.15);
    padding: 32px 28px;
    text-align: center;
  }

  #login .brand-icon {
    font-size: 2.4rem;
    line-height: 1;
    margin-bottom: 8px;
  }

  #login h1 {
    font-size: 1.25rem;
    color: var(--green-dark);
    margin: 0 0 4px;
  }

  #login p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }

  #login input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #d7e3d7;
    font-size: 0.95rem;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  #login input:focus { border-color: var(--green-light); }

  #login button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  #login button:hover { background: var(--green-dark); }

  /* ---------- Chat ---------- */
  #chat {
    display: none;
    width: 380px;
    height: 640px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 14px 36px rgba(27, 94, 32, 0.18);
    overflow: hidden;
    grid-template-rows: auto 1fr auto;
  }

  #chatHeader {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color: #fff;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #chatHeader .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    flex-shrink: 0;
  }

  #chatHeader .info { line-height: 1.25; overflow: hidden; }
  #chatHeader .info strong { display: block; font-size: 0.95rem; }
  #chatHeader .info span {
    font-size: 0.75rem;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  #chatHeader .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8bc34a;
    box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.35);
  }
  #chatHeader .dot.offline { background: #e57373; box-shadow: 0 0 0 3px rgba(229, 115, 115, 0.35); }

  #messages {
    list-style: none;
    margin: 0;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #f6faf6;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 78%;
    margin-bottom: 6px;
  }
  .msg-row.own { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }
  .msg-row.system { align-self: center; max-width: 100%; }

  .msg-sender {
    font-size: 0.7rem;
    color: var(--green);
    font-weight: 600;
    margin: 0 4px 2px;
  }

  .bubble {
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.35;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .msg-row.own .bubble {
    background: var(--bubble-own);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg-row.other .bubble {
    background: var(--bubble-other);
    color: var(--text-dark);
    border: 1px solid #e6ede6;
    border-bottom-left-radius: 4px;
  }

  .msg-row.system .bubble {
    background: #e8f0e8;
    color: var(--text-muted);
    font-size: 0.75rem;
    padding: 4px 12px;
    text-align: center;
  }

  .msg-time {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin: 2px 5px 0;
  }

  #form {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #e9efe9;
  }

  #messageInput {
    flex: 1;
    padding: 11px 14px;
    border-radius: 999px;
    border: 1px solid #d7e3d7;
    font-size: 0.9rem;
    outline: none;
  }
  #messageInput:focus { border-color: var(--green-light); }

  #sendBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--green);
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #sendBtn:hover { background: var(--green-dark); }
</style>
</head>
<body>

  <div id="login">
    <div class="brand-icon">🌿</div>
    <h1>EcoHome Store</h1>
    <p>Chat en tiempo real &mdash; ingresa tu nombre para conectarte</p>
    <input id="username" type="text" placeholder="Ej: Angie" autocomplete="off" />
    <button id="connectBtn">Conectar</button>
  </div>

  <section id="chat">
    <div id="chatHeader">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="info">
        <strong id="currentUser">&mdash;</strong>
        <span><span class="dot" id="statusDot"></span><span id="statusText">Conectando...</span></span>
      </div>
    </div>

    <ul id="messages"></ul>

    <form id="form">
      <input id="messageInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off" />
      <button id="sendBtn" type="submit" aria-label="Enviar">&#10148;</button>
    </form>
  </section>

  <!-- Cliente de Socket.IO servido automáticamente por el servidor en /socket.io/socket.io.js -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const loginDiv = document.getElementById("login");
    const chatDiv = document.getElementById("chat");
    const usernameInput = document.getElementById("username");
    const connectBtn = document.getElementById("connectBtn");
    const currentUserSpan = document.getElementById("currentUser");
    const avatarInitial = document.getElementById("avatarInitial");
    const messagesList = document.getElementById("messages");
    const form = document.getElementById("form");
    const messageInput = document.getElementById("messageInput");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    let socket = null;
    let myUsername = "";

    function addSystemMessage(text) {
      const li = document.createElement("li");
      li.className = "msg-row system";
      li.innerHTML = `<div class="bubble">${text}</div>`;
      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function addChatMessage(msg) {
      const isOwn = msg.username === myUsername;
      const li = document.createElement("li");
      li.className = `msg-row ${isOwn ? "own" : "other"}`;

      const senderHtml = isOwn ? "" : `<div class="msg-sender">${msg.username}</div>`;

      li.innerHTML = `
        ${senderHtml}
        <div class="bubble">${msg.text}</div>
        <div class="msg-time">${msg.time}</div>
      `;
      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function connect() {
      const username = usernameInput.value.trim() || `Invitado-${Math.floor(Math.random() * 1000)}`;
      myUsername = username;

      // Conexión vía WebSocket puro, enviando el username en la query
      // tal como lo espera el servidor (socket.handshake.query.username).
      socket = io("http://localhost:4000", {
        transports: ["websocket"],
        query: { username },
      });

      socket.on("connect", () => {
        currentUserSpan.textContent = username;
        avatarInitial.textContent = username.charAt(0).toUpperCase();
        statusDot.classList.remove("offline");
        statusText.textContent = "En línea";
        loginDiv.style.display = "none";
        chatDiv.style.display = "grid";
        addSystemMessage(`Conectado como ${username}`);
        messageInput.focus();
      });

      socket.on("disconnect", () => {
        statusDot.classList.add("offline");
        statusText.textContent = "Desconectado";
        addSystemMessage("Conexión perdida con el servidor");
      });

      // Escucha los mensajes retransmitidos (broadcast) por el servidor.
      socket.on("new-message", (msg) => addChatMessage(msg));
    }

    connectBtn.addEventListener("click", connect);
    usernameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") connect();
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket) return;

      const msg = {
        username: myUsername,
        text,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      };

      socket.emit("new-message", msg);
      messageInput.value = "";
    });
  </script>
</body>
</html>
